name: Feature Request

description: Suggest a new tool or feature for SLIT.IO

labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe your idea below.

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: A clear and concise description of what you want.
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: Use Case
      description: Why do you need this? What problem does it solve?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you found any alternative tools or workarounds?
    validations:
      required: false

  - type: dropdown
    id: type
    attributes:
      label: Feature Type
      options:
        - New tool
        - Improvement to existing tool
        - UI/UX improvement
        - Performance improvement
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or references.
    validations:
      required: false
